[package]
name = "sha2-collision"
authors = ["Supermarcel10"]
version = "0.1.2"
edition = "2024"
license = "CC BY-NC-SA"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series", "point_series"] }
thiserror = "2.0.11"
clap = { version = "4.5.36", features = ["derive"] }
num-traits = "0.2.19"
sha2-core = { path = "crates/sha2-core" }
sha2-verify = { path = "crates/sha2-verify" }
sha2-smt = { path = "crates/sha2-smt" }
sha2-bench = { path = "crates/sha2-bench" }

[workspace]
members = [".", "crates/sha2-core", "crates/sha2-verify", "crates/sha2-smt", "crates/sha2-bench"]
